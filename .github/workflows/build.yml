name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download TWRP source
        run: |
          mkdir twrp
          cd twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Copy device tree
        run: |
          mkdir -p twrp/device/samsung/xcover4s
          cp -r Android.bp Android.mk AndroidProducts.mk BoardConfig.mk \
            device.mk extract-files.sh twrp_xcover4s.mk README.md \
            recovery.fstab setup-makefiles.sh vendorsetup.sh \
            twrp/device/samsung/xcover4s
          cp -r prebuilt recovery twrp/device/samsung/xcover4s/

      - name: Build TWRP
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_xcover4s-eng
          mka recoveryimage -j2

      - name: Check AVB
        run: |
          cd twrp
          echo "=== RECOVERY SIZE ==="
          stat -c%s out/target/product/xcover4s/recovery.img

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-recovery
          path: twrp/out/target/product/xcover4s/recovery.img
