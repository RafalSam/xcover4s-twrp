name: Build TWRP for XCover 4s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-11

          repo sync -c -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Copy XCover 4s device tree
        run: |
          mkdir -p ~/twrp/device/samsung/xcover4s

          cp -r ./* ~/twrp/device/samsung/xcover4s/

      - name: Build TWRP
        run: |
          cd ~/twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch omni_xcover4s-eng

          mka recoveryimage

      - name: Prepare recovery image
        run: |
          mkdir -p output

          cp ~/twrp/out/target/product/xcover4s/recovery.img \
            output/recovery.img

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-twrp-recovery
          path: output/recovery.img
