name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download minimal TWRP source
        run: |
          git clone --depth=1 https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-12.1 manifest

      - name: Initialize build
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-12.1 --depth=1
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Add device tree
        run: |
          mkdir -p twrp/device/samsung
          cp -r . twrp/device/samsung/xcover4s

      - name: Build recovery
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_xcover4s-eng
          mka recoveryimage

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-recovery
          path: twrp/out/target/product/xcover4s/recovery.img
